<svg xmlns="http://www.w3.org/2000/svg" width="720" height="348" viewBox="0 0 720 348" role="img">
  <title>Four steps to compress a batch</title>
  <rect x="1" y="1" width="718" height="346" rx="20" fill="#f5f6f7" stroke="#d8dce1"/>
  <g font-family="Segoe UI, Microsoft YaHei UI, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="24" y="48" font-size="30" font-weight="700" fill="#202124">Four steps to compress a batch</text><rect x="20" y="74" width="331" height="116" rx="15" fill="#fff" stroke="#dde0e4"/><rect x="38" y="91" width="41" height="35" rx="8" fill="#25272a" stroke="#25272a"/><text x="46" y="116" font-size="19" font-weight="600" fill="#fff">01</text><text x="92" y="118" font-size="26" font-weight="700" fill="#202124">Add files</text><text x="39" y="161" font-size="22" font-weight="400" fill="#51565d">Drop PDFs or a folder</text><rect x="369" y="74" width="331" height="116" rx="15" fill="#fff" stroke="#dde0e4"/><rect x="387" y="91" width="41" height="35" rx="8" fill="#25272a" stroke="#25272a"/><text x="395" y="116" font-size="19" font-weight="600" fill="#fff">02</text><text x="441" y="118" font-size="26" font-weight="700" fill="#202124">Choose a preset</text><text x="388" y="161" font-size="22" font-weight="400" fill="#51565d">Fidelity / Sharing / Compact</text><rect x="20" y="210" width="331" height="116" rx="15" fill="#fff" stroke="#dde0e4"/><rect x="38" y="227" width="41" height="35" rx="8" fill="#25272a" stroke="#25272a"/><text x="46" y="252" font-size="19" font-weight="600" fill="#fff">03</text><text x="92" y="254" font-size="26" font-weight="700" fill="#202124">Set output location</text><text x="39" y="297" font-size="22" font-weight="400" fill="#51565d">Beside originals or one folder</text><rect x="369" y="210" width="331" height="116" rx="15" fill="#fff" stroke="#dde0e4"/><rect x="387" y="227" width="41" height="35" rx="8" fill="#25272a" stroke="#25272a"/><text x="395" y="252" font-size="19" font-weight="600" fill="#fff">04</text><text x="441" y="254" font-size="26" font-weight="700" fill="#202124">Start and review</text><text x="388" y="297" font-size="22" font-weight="400" fill="#51565d">Open a completed queue item</text></g>
</svg>