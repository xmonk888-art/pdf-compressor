<svg xmlns="http://www.w3.org/2000/svg" width="360" height="389" viewBox="0 0 360 389" role="img">
  <title>Four steps to compress a batch</title>
  <rect x="1" y="1" width="358" height="387" rx="20" fill="#f5f6f7" stroke="#d8dce1"/>
  <g font-family="Segoe UI, Microsoft YaHei UI, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="20" y="37" font-size="22" font-weight="700" fill="#202124">Four steps to compress a batch</text><rect x="12" y="54" width="336" height="73" rx="15" fill="#fff" stroke="#dde0e4"/><rect x="23" y="67" width="31" height="28" rx="7" fill="#25272a" stroke="#25272a"/><text x="29" y="87" font-size="16" font-weight="600" fill="#fff">01</text><text x="65" y="86" font-size="23" font-weight="700" fill="#202124">Add files</text><text x="65" y="112" font-size="19" font-weight="400" fill="#51565d">Drop PDFs or a folder</text><rect x="12" y="137" width="336" height="73" rx="15" fill="#fff" stroke="#dde0e4"/><rect x="23" y="150" width="31" height="28" rx="7" fill="#25272a" stroke="#25272a"/><text x="29" y="170" font-size="16" font-weight="600" fill="#fff">02</text><text x="65" y="169" font-size="23" font-weight="700" fill="#202124">Choose a preset</text><text x="65" y="195" font-size="19" font-weight="400" fill="#51565d">Fidelity / Sharing / Compact</text><rect x="12" y="220" width="336" height="73" rx="15" fill="#fff" stroke="#dde0e4"/><rect x="23" y="233" width="31" height="28" rx="7" fill="#25272a" stroke="#25272a"/><text x="29" y="253" font-size="16" font-weight="600" fill="#fff">03</text><text x="65" y="252" font-size="23" font-weight="700" fill="#202124">Set output location</text><text x="65" y="278" font-size="19" font-weight="400" fill="#51565d">Beside originals or one folder</text><rect x="12" y="303" width="336" height="73" rx="15" fill="#fff" stroke="#dde0e4"/><rect x="23" y="316" width="31" height="28" rx="7" fill="#25272a" stroke="#25272a"/><text x="29" y="336" font-size="16" font-weight="600" fill="#fff">04</text><text x="65" y="335" font-size="23" font-weight="700" fill="#202124">Start and review</text><text x="65" y="361" font-size="19" font-weight="400" fill="#51565d">Open a completed queue item</text></g>
</svg>