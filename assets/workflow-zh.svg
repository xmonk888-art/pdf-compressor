  <title>四步完成一批 PDF</title>
  <rect x="1" y="1" width="718" height="346" rx="20" fill="#f5f6f7" stroke="#d8dce1"/>
  <g font-family="Segoe UI, Microsoft YaHei UI, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="24" y="48" font-size="30" font-weight="700" fill="#202124">四步完成一批 PDF</text><rect x="20" y="74" width="331" height="116" rx="15" fill="#fff" stroke="#dde0e4"/><rect x="38" y="91" width="41" height="35" rx="8" fill="#25272a" stroke="#25272a"/><text x="46" y="116" font-size="19" font-weight="600" fill="#fff">01</text><text x="92" y="118" font-size="26" font-weight="700" fill="#202124">添加文件</text><text x="39" y="161" font-size="22" font-weight="400" fill="#51565d">拖入 PDF 或文件夹</text><rect x="369" y="74" width="331" height="116" rx="15" fill="#fff" stroke="#dde0e4"/><rect x="387" y="91" width="41" height="35" rx="8" fill="#25272a" stroke="#25272a"/><text x="395" y="116" font-size="19" font-weight="600" fill="#fff">02</text><text x="441" y="118" font-size="26" font-weight="700" fill="#202124">选压缩模式</text><text x="388" y="161" font-size="22" font-weight="400" fill="#51565d">高清／分享／小巧</text><rect x="20" y="210" width="331" height="116" rx="15" fill="#fff" stroke="#dde0e4"/><rect x="38" y="227" width="41" height="35" rx="8" fill="#25272a" stroke="#25272a"/><text x="46" y="252" font-size="19" font-weight="600" fill="#fff">03</text><text x="92" y="254" font-size="26" font-weight="700" fill="#202124">设置保存位置</text><text x="39" y="297" font-size="22" font-weight="400" fill="#51565d">原文件旁或指定目录</text><rect x="369" y="210" width="331" height="116" rx="15" fill="#fff" stroke="#dde0e4"/><rect x="387" y="227" width="41" height="35" rx="8" fill="#25272a" stroke="#25272a"/><text x="395" y="252" font-size="19" font-weight="600" fill="#fff">04</text><text x="441" y="254" font-size="26" font-weight="700" fill="#202124">开始并查看</text><text x="388" y="297" font-size="22" font-weight="400" fill="#51565d">在队列双击成功项</text></g>
